[package]
name = "cargry"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "compiler/*",
    "crates/*",
]

[workspace.dependencies]
lewekk = { path = "crates/lewekk" }
lewekk-head = { path = "crates/lewekk-head" }
lewekk-macro = { path = "crates/lewekk-macro" }
lewekk-utils = { path = "crates/lewekk-utils" }
popdack = { path = "crates/popdack" }
popdack-macro = { path = "crates/popdack-macro" }
cargry-errors = { path = "compiler/cargry-errors" }
lexer = { path = "compiler/lexer" }

colored = "3.1.1"
regex = "1.12.4"
cranelift = "0.132.1"
cranelift-codegen = "0.132.1"
cranelift-frontend = "0.132.1"
cranelift-module = "0.132.1"
cranelift-native = "0.132.1"
cranelift-object = "0.132.1"

[dependencies]
lewekk = { workspace = true }
lewekk-head = { workspace = true }
lewekk-macro = { workspace = true }
lewekk-utils = { workspace = true }
popdack = { workspace = true }
popdack-macro = { workspace = true }
cargry-errors = { workspace = true }
lexer = { workspace = true }

regex = { workspace = true }
